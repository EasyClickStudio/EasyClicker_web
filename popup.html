<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      background-color: #1A1B1E;
      border-radius: 14px;
      overflow: hidden;
    }

    body {
      width: 290px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #F3F4F6;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 0 2px;
    }
    .header img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      color: #F3F4F6;
    }

    .card {
      background-color: #2B2D31;
      border: 1px solid #3F4147;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: #CBD5E1;
      display: block;
      margin-bottom: 3px;
    }

    input[type="number"] {
      width: 100%;
      background-color: #1E1F22;
      border: 1px solid #3F4147;
      border-radius: 6px;
      color: #F3F4F6;
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus {
      border-color: #2563EB;
    }

    .btn-hotkey {
      width: 100%;
      background-color: #3F4147;
      color: #F3F4F6;
      border: 1px solid #4E5058;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .btn-hotkey:hover { background-color: #4E5058; }
    .btn-hotkey.binding {
      background-color: #D97706;
      color: #FFFFFF;
      border-color: #F59E0B;
    }

    .status-lbl {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #EF4444;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="icon.png" alt="logo" onerror="this.style.display='none'">
    <h1>EasyClicker</h1>
  </div>

  <div class="card">
    <div>
      <label>Click Interval (ms):</label>
      <input type="number" id="ac_interval" value="100" min="10">
    </div>

    <div>
      <label>Random Offset (± ms):</label>
      <input type="number" id="ac_offset" value="20" min="0">
    </div>

    <div>
      <label>Global Start/Stop Hotkey:</label>
      <button id="ac_hk_btn" class="btn-hotkey">[F8] (Click to Set)</button>
    </div>

    <div id="ac_status" class="status-lbl">Status: STOPPED</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
